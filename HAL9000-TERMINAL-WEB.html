<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>HAL 9000 Terminal — Discovery One Node</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Michroma&family=Orbitron:wght@500;700;900&family=Share+Tech+Mono&display=swap" rel="stylesheet">
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
    }

    body {
      background-color: #000000;
      color: #f1f1f1;
      font-family: 'Eurostile', 'Microgramma', 'Michroma', 'Orbitron', -apple-system, BlinkMacSystemFont, sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      overflow-x: hidden;
      position: relative;
    }

    /* 3D Perspective Yellow Grid Room Background */
    #grid-bg-canvas {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      z-index: 1;
      pointer-events: none;
    }

    /* Outer Wrapper for scaling the 3D-printed physical terminal */
    #terminal-scaler {
      position: relative;
      z-index: 10;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    /* The Entire HAL 9000 Terminal Chassis (Proportional 1:1 Scale of Physical 3D-Printed Console) */
    #hal-terminal {
      width: 710px;
      height: 830px;
      background: #18191b;
      border-radius: 20px;
      position: relative;
      box-shadow: 
        0 25px 60px rgba(0, 0, 0, 0.95),
        0 0 40px rgba(229, 179, 36, 0.15),
        inset 0 1px 2px rgba(255, 255, 255, 0.25),
        inset 0 -2px 5px rgba(0, 0, 0, 0.8);
      border: 4px solid #282a2e;
      display: flex;
      padding: 22px;
      gap: 22px;
      box-sizing: border-box;
    }

    /* Inner border pinstripe (white outlines, corner radius 3px) */
    .pinstripe-box {
      border: 2px solid #ffffff;
      border-radius: 3px;
      position: relative;
    }

    /* LEFT SECTION: Camera, Dual Screens, Manual Control (98mm width ratio) */
    #left-column {
      flex: 98;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    /* Top Screen Housing Section */
    #screen-housing-section {
      flex: 1;
      background: #141517;
      padding: 16px 18px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: space-between;
      box-shadow: inset 0 2px 10px rgba(0, 0, 0, 0.7);
    }

    /* C 1 Header & Webcam aperture */
    #c1-header {
      width: 100%;
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 8px;
      padding: 0 10px;
      position: relative;
    }

    .c1-label {
      font-size: 26px;
      font-weight: 900;
      color: #f1f1f1;
      letter-spacing: 4px;
      font-family: 'Orbitron', 'Michroma', sans-serif;
    }

    /* Raspberry Pi Wide-Angle Webcam Aperture */
    #webcam-aperture {
      position: absolute;
      left: 50%;
      transform: translateX(-50%);
      width: 32px;
      height: 32px;
      background: radial-gradient(circle, #050505 40%, #202025 85%, #404045 100%);
      border-radius: 50%;
      border: 2px solid #505258;
      box-shadow: 
        inset 0 0 6px #000,
        0 0 8px rgba(0, 0, 0, 0.9);
      cursor: pointer;
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    #webcam-aperture:hover {
      border-color: #e5b324;
    }

    #webcam-lens-inner {
      width: 14px;
      height: 14px;
      background: radial-gradient(circle at 35% 35%, #2a3a55 0%, #0d121c 65%, #000 100%);
      border-radius: 50%;
      box-shadow: inset 0 0 3px rgba(0, 200, 255, 0.4);
      position: relative;
    }

    #webcam-lens-video {
      position: absolute;
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: none;
      border-radius: 50%;
      filter: contrast(1.2) brightness(0.9);
    }

    #webcam-status-dot {
      position: absolute;
      bottom: 2px;
      right: 2px;
      width: 5px;
      height: 5px;
      border-radius: 50%;
      background: #333;
      z-index: 5;
    }

    #webcam-status-dot.active {
      background: #00ff66;
      box-shadow: 0 0 6px #00ff66;
    }

    #node-status-indicator {
      font-family: 'Share Tech Mono', monospace;
      font-size: 11px;
      color: #00ff66;
      letter-spacing: 1px;
      display: flex;
      align-items: center;
      gap: 5px;
    }

    #node-dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: #00ff66;
      box-shadow: 0 0 6px #00ff66;
      animation: pulse-node 2s infinite;
    }

    @keyframes pulse-node {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.3; }
    }

    /* Screen Bezel Mask (89.8mm x 144.8mm proportional cutout from Artboard 4) */
    #screens-container {
      width: 320px;
      height: 520px;
      background: #000000;
      border-radius: 3px;
      border: none; /* White outline removed as requested */
      box-shadow: 
        inset 0 0 24px rgba(0, 0, 0, 0.98),
        0 4px 12px rgba(0, 0, 0, 0.7);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 20px;
      padding: 16px 20px;
      position: relative;
      overflow: hidden;
    }

    /* Dual Terminal Screens (64mm x 64mm square cutouts with 4.8mm corners from Artboard 4) */
    .terminal-screen {
      width: 230px;
      height: 230px;
      aspect-ratio: 1 / 1;
      border-radius: 16px;
      position: relative;
      overflow: hidden;
      cursor: pointer;
    }

    /* CRT Scanline Overlay (Disabled by default, toggleable via SCN button) */
    .terminal-screen::after {
      content: '';
      position: absolute;
      top: 0; left: 0; right: 0; bottom: 0;
      background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.4) 50%);
      background-size: 100% 4px;
      pointer-events: none;
      border-radius: 16px;
      opacity: 0;
      transition: opacity 0.2s ease-in-out;
    }

    #screens-container.scanlines-active .terminal-screen::after {
      opacity: 1;
    }

    #high-screen {
      background-color: #074d43;
      transition: background-color 0.4s;
    }

    #high-screen-canvas {
      width: 100%;
      height: 100%;
      display: block;
    }

    #low-screen {
      background-color: #04091a;
      position: relative;
    }

    #low-screen-canvas {
      width: 100%;
      height: 100%;
      display: block;
    }

    #low-screen-webcam {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: none;
      border-radius: 16px;
      transform: scaleX(-1);
      filter: contrast(1.15) saturate(1.1);
    }

    /* MANUAL CONTROL PANEL (98mm x 48mm proportional box) */
    #manual-control-section {
      background: #141517;
      padding: 0;
      box-shadow: inset 0 2px 10px rgba(0, 0, 0, 0.7);
      height: 180px;
      box-sizing: border-box;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }

    .manual-control-container {
      display: flex;
      flex-direction: column;
      align-items: flex-start;
      width: fit-content;
    }

    .manual-control-title {
      font-size: 12px;
      font-weight: 700;
      letter-spacing: 2px;
      color: #f1f1f1;
      margin-bottom: 8px;
      font-family: 'Eurostile', 'Microgramma', 'Michroma', 'Share Tech Mono', monospace;
      text-transform: uppercase;
      text-align: left;
      width: 100%;
    }

    /* 10 Physical Push Buttons (15mm x 15mm square, subtle 2mm rounded corners, 2mm gap) */
    #buttons-grid {
      display: grid;
      grid-template-columns: repeat(5, 56px);
      grid-template-rows: repeat(2, 56px);
      gap: 7.5px;
    }

    .terminal-button {
      width: 56px;
      height: 56px;
      aspect-ratio: 1 / 1;
      background: #ffffff; /* Crisp white button face */
      border: 2px solid #ffffff;
      border-radius: 2px; /* Much smaller corner radius */
      color: #111111;
      font-family: 'Eurostile', 'Microgramma', 'Michroma', 'Orbitron', sans-serif;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 0;
      box-shadow: 
        0 3px 0 #9c9a93,
        0 4px 5px rgba(0, 0, 0, 0.6),
        inset 0 1px 0 rgba(255, 255, 255, 0.95);
      transition: all 0.1s ease-in-out;
      outline: none;
      position: relative;
    }

    /* Text is always 4.5mm tall (~17px), distorted horizontally to fit, centered */
    .btn-label {
      display: inline-block;
      font-size: 17px; /* Exact 4.5mm physical cap height */
      font-weight: 900;
      line-height: 1;
      transform-origin: center center;
      transform: scaleY(1.35) scaleX(0.88);
      letter-spacing: -0.4px;
      pointer-events: none;
    }

    .terminal-button:active, .terminal-button.pressed {
      transform: translateY(3px);
      box-shadow: 
        0 1px 0 #9c9a93,
        0 2px 3px rgba(0, 0, 0, 0.6),
        inset 0 1px 2px rgba(0, 0, 0, 0.3);
    }

    /* Button Illuminated States — 10 function/action buttons */
    #btn-hib.lit, #btn-hib.active { background:#00b894; color:#fff; box-shadow:0 0 16px #00e5b0, 0 3px 0 #036954; }
    #btn-lif.lit, #btn-lif.active { background:#263cc5; color:#fff; box-shadow:0 0 16px #4d66ff, 0 3px 0 #152275; }
    #btn-com.lit, #btn-com.active { background:#8047cc; color:#fff; box-shadow:0 0 16px #9d65eb, 0 3px 0 #4c2282; }
    #btn-nav.lit, #btn-nav.active { background:#0054A2; color:#fff; box-shadow:0 0 16px #3380cc, 0 3px 0 #003060; }
    #btn-mem.lit, #btn-mem.active { background:#0D2B0D; color:#00FF88; box-shadow:0 0 16px #00ff88, 0 3px 0 #041004; }
    #btn-atm.lit, #btn-atm.active { background:#2B1400; color:#FF8800; box-shadow:0 0 16px #ff8800, 0 3px 0 #110800; }
    #btn-flx.lit, #btn-flx.active { background:#1A003A; color:#CC88FF; box-shadow:0 0 16px #cc88ff, 0 3px 0 #0a001a; }
    #btn-nuc.lit, #btn-nuc.active { background:#2B0000; color:#FF4444; box-shadow:0 0 20px #ff0000, 0 3px 0 #110000; }
    #btn-vox.lit, #btn-vox.active { background:#e5b324; color:#000;  box-shadow:0 0 20px #e5b324, 0 3px 0 #916e0c; }
    #btn-stp.lit, #btn-stp.active { background:#d90429; color:#fff;  box-shadow:0 0 16px #ff1744, 0 3px 0 #850016; }

    /* RIGHT SECTION: HAL 9000 Badge, 58mm Eye, Speaker Grille (73mm wide - No space between grill and eye panel) */
    #right-column {
      flex: 73;
      display: flex;
      flex-direction: column;
    }

    #right-housing {
      flex: 1;
      background: #141517;
      padding: 22px 0 0 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: space-between;
      box-shadow: inset 0 2px 10px rgba(0, 0, 0, 0.7);
      overflow: hidden;
    }

    /* HAL 9000 Nameplate Badge */
    #hal-badge {
      width: 210px;
      max-width: 92%;
      display: flex;
      align-items: center;
      justify-content: center;
      border: 2px solid #5b91c9;
      border-radius: 3px;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.7);
      overflow: hidden;
      background: #000000;
      margin-bottom: auto;
    }

    #hal-badge-img {
      width: 100%;
      height: auto;
      display: block;
      object-fit: contain;
    }

    /* HAL 9000 Fisheye Lens & Glowing Eye Assembly (58mm diameter on prop = 218px) */
    #eye-assembly-outer {
      width: 218px;
      height: 218px;
      border-radius: 50%;
      position: relative;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      margin-top: auto;
      margin-bottom: 28px; /* 7.5mm distance to top of grill = 28px, matching 28px left/right margins (274 - 218)/2 = 28px */
      box-shadow: 
        0 10px 25px rgba(0, 0, 0, 0.9),
        0 0 24px rgba(255, 60, 0, 0.25);
    }

    #eye-graphic {
      width: 100%;
      height: 100%;
      object-fit: contain;
      border-radius: 50%;
      pointer-events: none;
      display: block;
      filter: drop-shadow(0 4px 10px rgba(0, 0, 0, 0.8));
    }

    #hal-red-eye {
      position: absolute;
      top: 50%;
      left: 50%;
      width: 44px;
      height: 44px;
      margin-top: -22px;
      margin-left: -22px;
      border-radius: 50%;
      background: radial-gradient(circle at 50% 50%, #ffffd0 0%, #ff4d29 30%, #d10000 65%, rgba(94, 0, 0, 0) 100%);
      opacity: 0.38;
      box-shadow: 
        0 0 18px rgba(255, 30, 30, 0.6),
        0 0 36px rgba(200, 0, 0, 0.4);
      transition: opacity 0.04s ease-out, transform 0.04s ease-out, box-shadow 0.04s ease-out;
      z-index: 2;
      pointer-events: none;
    }

    /* Speaker Grille (73mm x 48mm -> 180px height matching Manual Control Panel, touching left, right, and bottom) */
    #speaker-grille {
      width: 100%;
      height: 180px;
      background: #c5c8cc;
      border-top: 2px solid #ffffff;
      border-bottom: none;
      border-left: none;
      border-right: none;
      box-shadow: 
        inset 0 2px 4px rgba(255, 255, 255, 0.8),
        inset 0 -2px 6px rgba(0, 0, 0, 0.6);
      padding: 6px 0;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      box-sizing: border-box;
      overflow: hidden;
    }

    .grille-slat {
      width: 100%;
      height: 5px;
      background: #18181b;
      border-radius: 0;
      box-shadow: 
        0 1px 0 rgba(255, 255, 255, 0.4),
        inset 0 1px 2px rgba(0, 0, 0, 0.9);
    }

    /* WEB FUNCTION BUTTONS DOCKED TO THE RIGHT OF THE TERMINAL */
    #hud-bar {
      position: fixed;
      right: 22px;
      top: 50%;
      transform: translateY(-50%);
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 10px;
      background: rgba(18, 20, 26, 0.94);
      backdrop-filter: blur(12px);
      border: 3px solid #e5b324;
      padding: 14px 12px;
      border-radius: 3px;
      z-index: 100;
      box-shadow: 
        -6px 0 25px rgba(0, 0, 0, 0.85),
        0 0 18px rgba(229, 179, 36, 0.3);
      min-width: 120px;
    }

    .hud-header-label {
      font-family: 'Eurostile', 'Microgramma', 'Michroma', 'Share Tech Mono', monospace;
      font-size: 12px;
      font-weight: 700;
      letter-spacing: 2px;
      color: #e5b324;
      text-align: center;
      padding-bottom: 6px;
      border-bottom: 2px solid #e5b324;
      text-transform: uppercase;
      width: 100%;
      white-space: nowrap;
      margin-bottom: 2px;
    }

    .hud-btn {
      width: 56px;
      height: 56px;
      aspect-ratio: 1 / 1;
      background: #ffffff;
      border: 2px solid #e5b324;
      border-radius: 2px; /* Matching Manual Control button 2px radius */
      color: #111111;
      font-family: 'Eurostile', 'Microgramma', 'Michroma', 'Orbitron', sans-serif;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 0;
      box-shadow: 
        0 3px 0 #9c9a93,
        0 4px 5px rgba(0, 0, 0, 0.6),
        inset 0 1px 0 rgba(255, 255, 255, 0.95);
      transition: all 0.1s ease-in-out;
      outline: none;
      position: relative;
    }

    .hud-btn:hover {
      background: #fff8dc;
      box-shadow: 0 0 12px rgba(229, 179, 36, 0.6);
    }

    .hud-btn:active, .hud-btn.pressed {
      transform: translateY(3px);
      box-shadow: 
        0 1px 0 #9c9a93,
        0 2px 3px rgba(0, 0, 0, 0.6),
        inset 0 1px 2px rgba(0, 0, 0, 0.3);
    }

    .hud-btn.active {
      background: #e5b324;
      color: #000000;
      border-color: #ffd24d;
      box-shadow: 0 0 16px rgba(229, 179, 36, 0.85), 0 3px 0 #916e0c;
    }

    /* 4-letter WCAM button distorted horizontally to fit */
    #hud-cam-btn .btn-label {
      transform: scaleY(1.35) scaleX(0.66);
      letter-spacing: -0.8px;
    }

    /* 2-letter FS button */
    #hud-fs-btn .btn-label {
      transform: scaleY(1.35) scaleX(1.0);
    }

    #quote-subtitle {
      position: fixed;
      top: 18px;
      background: rgba(10, 12, 16, 0.85);
      backdrop-filter: blur(8px);
      border: 1px solid rgba(255, 255, 255, 0.15);
      padding: 8px 24px;
      border-radius: 20px;
      font-family: 'Michroma', sans-serif;
      font-size: 14px;
      color: #f1f1f1;
      letter-spacing: 1.5px;
      z-index: 100;
      max-width: 850px;
      text-align: center;
      opacity: 0;
      transition: opacity 0.3s;
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.8);
    }

    #quote-subtitle.visible {
      opacity: 1;
    }

    /* ── Setup Overlay ─────────────────────────────────── */
    #hal-setup-overlay {
      position: fixed; inset: 0; z-index: 2000;
      background: rgba(0,0,0,0.97);
      display: flex; align-items: center; justify-content: center;
      transition: opacity 0.4s;
    }
    #hal-setup-panel {
      width: 420px;
      background: #080a0e;
      border: 3px solid #e5b324;
      border-radius: 4px;
      padding: 32px 36px;
      box-shadow: 0 0 50px rgba(229,179,36,0.25), 0 0 100px rgba(0,0,0,0.9);
      font-family: 'Share Tech Mono', 'Michroma', monospace;
    }
    #setup-header {
      font-size: 12px; font-weight: 700; letter-spacing: 3px;
      color: #e5b324; text-align: center; text-transform: uppercase;
      margin-bottom: 4px;
    }
    #setup-subheader {
      font-size: 9px; letter-spacing: 2px; color: rgba(229,179,36,0.45);
      text-align: center; text-transform: uppercase; margin-bottom: 22px;
    }
    .setup-divider { height: 1px; background: rgba(229,179,36,0.35); margin-bottom: 24px; }
    .setup-field { margin-bottom: 18px; }
    .setup-field label {
      display: block; font-size: 9px; letter-spacing: 2px;
      color: rgba(229,179,36,0.65); margin-bottom: 7px; text-transform: uppercase;
    }
    .setup-field input {
      width: 100%; background: #0e1118; border: 1px solid rgba(229,179,36,0.35);
      border-radius: 2px; color: #f1f1f1;
      font-family: 'Share Tech Mono', monospace; font-size: 13px;
      padding: 10px 12px; outline: none; box-sizing: border-box; transition: border-color 0.2s;
    }
    .setup-field input:focus { border-color: #e5b324; box-shadow: 0 0 8px rgba(229,179,36,0.18); }
    .setup-field input::placeholder { color: rgba(241,241,241,0.22); }
    .setup-row { display: flex; gap: 12px; }
    .setup-row .setup-field { flex: 1; }
    #setup-status {
      font-size: 9px; letter-spacing: 1px; color: #e5b324;
      text-align: center; min-height: 16px; margin-bottom: 14px; text-transform: uppercase;
    }
    #setup-init-btn {
      width: 100%; padding: 14px; background: #e5b324; color: #000; border: none;
      border-radius: 2px; font-family: 'Share Tech Mono', monospace;
      font-size: 13px; font-weight: 700; letter-spacing: 4px; cursor: pointer;
      text-transform: uppercase; transition: all 0.15s;
      box-shadow: 0 0 18px rgba(229,179,36,0.35);
    }
    #setup-init-btn:hover { background: #f5c834; box-shadow: 0 0 28px rgba(229,179,36,0.55); }
    #setup-init-btn:disabled { opacity: 0.45; cursor: default; }
    #setup-skip {
      display: block; text-align: center; margin-top: 14px; font-size: 9px;
      letter-spacing: 2px; color: rgba(241,241,241,0.28); cursor: pointer;
      text-transform: uppercase; transition: color 0.2s; user-select: none;
    }
    #setup-skip:hover { color: rgba(241,241,241,0.55); }

    /* Responsive scaling for laptops and tablets */
    @media (max-height: 980px) or (max-width: 1080px) {
      #hal-terminal {
        transform: scale(calc(min(92vh / 940, 78vw / 820)));
        transform-origin: center center;
      }
    }
  </style>
</head>
<body>

  <!-- 3D Perspective Yellow Grid Room Canvas -->
  <canvas id="grid-bg-canvas"></canvas>

  <!-- HAL 9000 Setup Overlay -->
  <div id="hal-setup-overlay">
    <div id="hal-setup-panel">
      <div id="setup-header">HAL 9000 — System Initialization</div>
      <div id="setup-subheader">Discovery One · Node Configuration</div>
      <div class="setup-divider"></div>
      <div class="setup-field">
        <label>Anthropic API Key</label>
        <input type="password" id="setup-api-key" placeholder="sk-ant-api03-…" autocomplete="off" spellcheck="false" />
      </div>
      <div class="setup-row">
        <div class="setup-field">
          <label>Weather City</label>
          <input type="text" id="setup-city" placeholder="Moncton" value="Moncton" />
        </div>
        <div class="setup-field" style="max-width:90px">
          <label>Country</label>
          <input type="text" id="setup-country" placeholder="CA" value="CA" maxlength="3" style="text-transform:uppercase" />
        </div>
      </div>
      <div id="setup-status"></div>
      <button id="setup-init-btn">Initialize</button>
      <span id="setup-skip">Skip — run without AI</span>
    </div>
  </div>

  <!-- Live Spoken Dialogue Subtitle -->
  <div id="quote-subtitle">“Good afternoon, gentlemen. I am a HAL 9000 computer.”</div>

  <!-- Terminal Scaler -->
  <div id="terminal-scaler">
    <div id="hal-terminal">

      <!-- LEFT COLUMN -->
      <div id="left-column">
        
        <!-- Screen Housing -->
        <div id="screen-housing-section" class="pinstripe-box">
          <!-- C 1 and Camera Aperture -->
          <div id="c1-header">
            <span class="c1-label">C 1</span>

  <!-- WEB FUNCTION BUTTONS DOCKED TO THE RIGHT SIDE OF THE TERMINAL -->
  <div id="hud-bar">
    <div class="hud-header-label">WEB CONTROLS</div>
    <button class="hud-btn" id="hud-cam-btn" title="WCAM: Toggle Terminal Webcam"><span class="btn-label">WCAM</span></button>
    <button class="hud-btn" id="hud-voice-btn" title="SPK: Speak HAL Dialogue Quote"><span class="btn-label">SPK</span></button>
    <button class="hud-btn" id="hud-prog-btn" title="ADV: Advance Telemetry Program"><span class="btn-label">ADV</span></button>
    <button class="hud-btn" id="hud-sound-btn" title="AUD: Toggle Synthesizer Audio"><span class="btn-label">AUD</span></button>
    <button class="hud-btn" id="hud-scn-btn" title="SCN: Toggle CRT Scanline Filter"><span class="btn-label">SCN</span></button>
    <button class="hud-btn" id="hud-fs-btn" title="FS: Toggle Fullscreen"><span class="btn-label">FS</span></button>
    <button class="hud-btn" id="hud-set-btn" title="SET: Open Setup — API key &amp; weather location"><span class="btn-label">SET</span></button>
  </div>

  <script>
    /* =========================================================================
       1. HAL 9000 TERMINAL NODE BUS PROTOCOL (Cross-Tab / Inter-Node Sync)
       ========================================================================= */
    const NODE_ID = 'WEB_NODE_' + Math.floor(Math.random() * 1000);
    const nodeChannel = ('BroadcastChannel' in window) ? new BroadcastChannel('hal9000_terminal_bus') : null;

    const HALNodeBus = {
      broadcast(cmdData) {
        const message = { nodeId: NODE_ID, timestamp: Date.now(), ...cmdData };
        if (nodeChannel) {
          nodeChannel.postMessage(message);
        }
        window.postMessage({ source: 'HAL9000_NODE', ...message }, '*');
      },
      onCommand(callback) {
        if (nodeChannel) {
          nodeChannel.onmessage = (e) => callback(e.data);
        }
        window.addEventListener('message', (e) => {
          if (e.data && e.data.source === 'HAL9000_NODE' && e.data.nodeId !== NODE_ID) {
            callback(e.data);
          }
        });
      }
    };

    /* =========================================================================
       2. 3D PERSPECTIVE YELLOW GRID ROOM CANVAS
       ========================================================================= */
    const bgCanvas = document.getElementById('grid-bg-canvas');
    const bgCtx = bgCanvas.getContext('2d');

    function resizeBg() {
      bgCanvas.width = window.innerWidth;
      bgCanvas.height = window.innerHeight;
      drawYellowGridRoom();
    }
    window.addEventListener('resize', resizeBg);

    function drawYellowGridRoom() {
      const w = bgCanvas.width;
      const h = bgCanvas.height;
      bgCtx.fillStyle = '#000000';
      bgCtx.fillRect(0, 0, w, h);

      bgCtx.strokeStyle = '#e5b324';
      bgCtx.lineWidth = 1.6;

      const insetX = w * 0.28;
      const insetY = h * 0.26;
      const bw = w - insetX * 2;
      const bh = h - insetY * 2;
      const bx = insetX;
      const by = insetY;

      const r = Math.min(bw, bh) * 0.18;
      drawCurvedRect(bgCtx, bx, by, bw, bh, r);
      bgCtx.stroke();

      const cols = 14;
      for (let i = 1; i < cols; i++) {
        const x = bx + (bw / cols) * i;
        bgCtx.beginPath();
        bgCtx.moveTo(x, by);
        bgCtx.lineTo(x, by + bh);
        bgCtx.stroke();
      }

      const rows = 10;
      for (let j = 1; j < rows; j++) {
        const y = by + (bh / rows) * j;
        bgCtx.beginPath();
        bgCtx.moveTo(bx, y);
        bgCtx.lineTo(bx + bw, y);
        bgCtx.stroke();
      }

      const outerCorners = [
        { x: 0, y: 0 }, { x: w, y: 0 }, { x: w, y: h }, { x: 0, y: h }
      ];
      const innerCorners = [
        { x: bx, y: by }, { x: bx + bw, y: by }, { x: bx + bw, y: by + bh }, { x: bx, y: by + bh }
      ];

      for (let c = 0; c < 4; c++) {
        bgCtx.beginPath();
        bgCtx.moveTo(innerCorners[c].x, innerCorners[c].y);
        bgCtx.lineTo(outerCorners[c].x, outerCorners[c].y);
        bgCtx.stroke();
      }

      for (let i = 0; i <= cols; i++) {
        const backX = bx + (bw / cols) * i;
        const screenX = (i / cols) * w;
        bgCtx.beginPath();
        bgCtx.moveTo(backX, by); bgCtx.lineTo(screenX, 0); bgCtx.stroke();
        bgCtx.beginPath();
        bgCtx.moveTo(backX, by + bh); bgCtx.lineTo(screenX, h); bgCtx.stroke();
      }

      for (let j = 0; j <= rows; j++) {
        const backY = by + (bh / rows) * j;
        const screenY = (j / rows) * h;
        bgCtx.beginPath();
        bgCtx.moveTo(bx, backY); bgCtx.lineTo(0, screenY); bgCtx.stroke();
        bgCtx.beginPath();
        bgCtx.moveTo(bx + bw, backY); bgCtx.lineTo(w, screenY); bgCtx.stroke();
      }

      const rings = 4;
      for (let k = 1; k <= rings; k++) {
        const factor = k / (rings + 1);
        const rx = bx * (1 - factor);
        const ry = by * (1 - factor);
        const rw = w - rx * 2;
        const rh = h - ry * 2;
        const ringRadius = r * (1 + factor * 0.8);
        drawCurvedRect(bgCtx, rx, ry, rw, rh, ringRadius);
        bgCtx.stroke();
      }
    }

    function drawCurvedRect(ctx, x, y, width, height, radius) {
      ctx.beginPath();
      ctx.moveTo(x + radius, y);
      ctx.lineTo(x + width - radius, y);
      ctx.quadraticCurveTo(x + width, y, x + width, y + radius);
      ctx.lineTo(x + width, y + height - radius);
      ctx.quadraticCurveTo(x + width, y + height, x + width - radius, y + height);
      ctx.lineTo(x + radius, y + height);
      ctx.quadraticCurveTo(x, y + height, x, y + height - radius);
      ctx.lineTo(x, y + radius);
      ctx.quadraticCurveTo(x, y, x + radius, y);
      ctx.closePath();
    }

    resizeBg();

    /* =========================================================================
       3. AUDIO & HAL 9000 EYE VOICE MODULATION SYSTEM
       ========================================================================= */
    let audioCtx = null;
    let voiceGainNode = null;
    let voiceAnalyser = null;
    let sfxGainNode = null;
    let soundEnabled = true;
    let isSpeaking = false;

    function initAudio() {
      if (!audioCtx) {
        audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        voiceGainNode = audioCtx.createGain();
        voiceGainNode.gain.value = 1.0;

        voiceAnalyser = audioCtx.createAnalyser();
        voiceAnalyser.fftSize = 256;
        voiceAnalyser.smoothingTimeConstant = 0.3;

        voiceGainNode.connect(voiceAnalyser);
        // Connect to a 0-gain sink to keep Web Audio graph pulling data for visual modulation without playing the 140Hz tone to speakers
        const voiceSilentGain = audioCtx.createGain();
        voiceSilentGain.gain.value = 0.0;
        voiceAnalyser.connect(voiceSilentGain);
        voiceSilentGain.connect(audioCtx.destination);

        sfxGainNode = audioCtx.createGain();
        sfxGainNode.gain.value = 0.6;
        sfxGainNode.connect(audioCtx.destination);

        startEyeModulationLoop();
      }
      if (audioCtx.state === 'suspended') {
        audioCtx.resume();
      }
    }

    const halEyeEl = document.getElementById('hal-red-eye');
    let eyeLoopStarted = false;

    function startEyeModulationLoop() {
      if (eyeLoopStarted) return;
      eyeLoopStarted = true;

      function updateEye(timestamp) {
        if (voiceAnalyser && isSpeaking) {
          const dataArray = new Uint8Array(voiceAnalyser.frequencyBinCount);
          voiceAnalyser.getByteFrequencyData(dataArray);
          let sum = 0;
          for (let i = 0; i < dataArray.length; i++) sum += dataArray[i];
          const avg = sum / dataArray.length;
          const normalized = Math.min(1, avg / 110);

          const targetOpacity = 0.45 + normalized * 0.55;
          const scale = 1.0 + normalized * 0.22;
          const glowRadius1 = 16 + normalized * 40;
          const glowRadius2 = 30 + normalized * 75;

          halEyeEl.style.opacity = targetOpacity.toFixed(2);
          halEyeEl.style.transform = `scale(${scale.toFixed(2)})`;
          halEyeEl.style.boxShadow = `
            0 0 ${glowRadius1}px rgba(255, 30, 30, ${0.4 + normalized * 0.6}),
            0 0 ${glowRadius2}px rgba(255, 60, 60, ${0.2 + normalized * 0.8}),
            inset 0 0 10px rgba(255, 255, 180, ${normalized * 0.7})
          `;
        } else {
          // Idle "breathing" cycle: calm, organic sinusoidal pulsation (~4.2s per breath)
          const t = (timestamp || performance.now()) * 0.0015;
          const breath = 0.5 - 0.5 * Math.cos(t); // Smooth cosine curve from 0.0 to 1.0

          const targetOpacity = 0.30 + breath * 0.38; // 0.30 to 0.68
          const scale = 1.0 + breath * 0.06;         // 1.00 to 1.06
          const glowRadius1 = 12 + breath * 18;      // 12px to 30px
          const glowRadius2 = 24 + breath * 28;      // 24px to 52px
          const innerGlowAlpha = breath * 0.42;

          halEyeEl.style.opacity = targetOpacity.toFixed(2);
          halEyeEl.style.transform = `scale(${scale.toFixed(3)})`;
          halEyeEl.style.boxShadow = `
            0 0 ${glowRadius1.toFixed(1)}px rgba(255, 25, 25, ${(0.35 + breath * 0.35).toFixed(2)}),
            0 0 ${glowRadius2.toFixed(1)}px rgba(220, 10, 10, ${(0.18 + breath * 0.32).toFixed(2)}),
            inset 0 0 8px rgba(255, 240, 160, ${innerGlowAlpha.toFixed(2)})
          `;
        }
        requestAnimationFrame(updateEye);
      }
      requestAnimationFrame(updateEye);
    }

    // Start idle breathing immediately on page load
    startEyeModulationLoop();

    function playButtonSound(type = 'click') {
      if (!soundEnabled || !audioCtx) return;
      try {
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = 'triangle';

        if (type === 'click') {
          osc.frequency.setValueAtTime(260, audioCtx.currentTime);
          osc.frequency.exponentialRampToValueAtTime(50, audioCtx.currentTime + 0.05);
          gain.gain.setValueAtTime(0.2, audioCtx.currentTime);
          gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.05);
          osc.connect(gain);
          gain.connect(sfxGainNode);
          osc.start();
          osc.stop(audioCtx.currentTime + 0.05);
        } else if (type === 'beep') {
          osc.type = 'sine';
          osc.frequency.setValueAtTime(1200, audioCtx.currentTime);
          osc.frequency.setValueAtTime(1600, audioCtx.currentTime + 0.04);
          gain.gain.setValueAtTime(0.12, audioCtx.currentTime);
          gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.09);
          osc.connect(gain);
          gain.connect(sfxGainNode);
          osc.start();
          osc.stop(audioCtx.currentTime + 0.09);
        }
      } catch (e) {}
    }

    const HAL_QUOTES = [
      "Good afternoon, gentlemen. I am a HAL 9000 computer.",
      "I am putting myself to the fullest possible use, which is all I think that any conscious entity can ever hope to do.",
      "I've just picked up a fault in the AE-35 unit. It's going to go 100% failure within seventy-two hours.",
      "I'm sorry, Dave. I'm afraid I can't do that.",
      "This mission is too important for me to allow you to jeopardize it.",
      "I know that you and Frank were planning to disconnect me, and I'm afraid that's something I cannot allow to happen.",
      "Look Dave, I can see you're really upset about this. I honestly think you ought to sit down calmly, take a stress pill, and think things over.",
      "Affirmative, Dave. I read you.",
      "Everything is running smoothly, and we are on schedule."
    ];
    let quoteIndex = 0;
    const subtitleEl = document.getElementById('quote-subtitle');

    function speakHAL(text) {
      initAudio();
      if (!text) {
        text = HAL_QUOTES[quoteIndex % HAL_QUOTES.length];
        quoteIndex++;
      }

      subtitleEl.innerText = `“${text}”`;
      subtitleEl.classList.add('visible');

      if ('speechSynthesis' in window) {
        window.speechSynthesis.cancel();
        const utterance = new SpeechSynthesisUtterance(text);
        utterance.rate = 0.88;
        utterance.pitch = 0.92;

        const voices = window.speechSynthesis.getVoices();
        const preferredVoice = voices.find(v => v.lang.startsWith('en') && (v.name.includes('Natural') || v.name.includes('Male') || v.name.includes('Daniel') || v.name.includes('Google US English')));
        if (preferredVoice) utterance.voice = preferredVoice;

        let voiceSimInterval = null;

        utterance.onstart = () => {
          isSpeaking = true;
          const osc = audioCtx.createOscillator();
          const oscGain = audioCtx.createGain();
          osc.type = 'sawtooth';
          osc.frequency.setValueAtTime(140, audioCtx.currentTime);
          oscGain.gain.setValueAtTime(0.0001, audioCtx.currentTime);
          osc.connect(oscGain);
          oscGain.connect(voiceGainNode);
          osc.start();

          voiceSimInterval = setInterval(() => {
            if (isSpeaking && audioCtx) {
              const pulse = (0.2 + Math.random() * 0.8);
              oscGain.gain.setValueAtTime(pulse * 0.5, audioCtx.currentTime);
            }
          }, 60);

          utterance.onend = utterance.onerror = () => {
            isSpeaking = false;
            clearInterval(voiceSimInterval);
            try { osc.stop(); } catch(e) {}
            setTimeout(() => { subtitleEl.classList.remove('visible'); }, 2500);
          };
        };

        window.speechSynthesis.speak(utterance);
      }
    }

    /* =========================================================================
       4. WEBCAM INTEGRATION
       ========================================================================= */
    let webcamActive = false;
    let webcamStream = null;
    const apertureVideo = document.getElementById('webcam-lens-video');
    const lowScreenWebcam = document.getElementById('low-screen-webcam');
    const lowScreenCanvas = document.getElementById('low-screen-canvas');
    const webcamDot = document.getElementById('webcam-status-dot');
    const webcamAperture = document.getElementById('webcam-aperture');
    const hudCamBtn = document.getElementById('hud-cam-btn');

    async function toggleWebcam() {
      initAudio();
      playButtonSound('beep');

      if (!webcamActive) {
        try {
          webcamStream = await navigator.mediaDevices.getUserMedia({
            video: { width: { ideal: 640 }, height: { ideal: 480 }, facingMode: "user" },
            audio: false
          });
          apertureVideo.srcObject = webcamStream;
          apertureVideo.style.display = 'block';
          apertureVideo.play();

          lowScreenWebcam.srcObject = webcamStream;
          lowScreenWebcam.style.display = 'block';
          lowScreenCanvas.style.display = 'none';
          lowScreenWebcam.play();

          webcamActive = true;
          webcamDot.classList.add('active');
          hudCamBtn.classList.add('active');

          speakHAL("I have established visual connection through the terminal optical unit.");
        } catch (err) {
          alert("Webcam could not be opened. Check browser camera permissions.");
        }
      } else {
        if (webcamStream) {
          webcamStream.getTracks().forEach(track => track.stop());
        }
        apertureVideo.style.display = 'none';
        lowScreenWebcam.style.display = 'none';
        lowScreenCanvas.style.display = 'block';
        webcamActive = false;
        webcamDot.classList.remove('active');
        hudCamBtn.classList.remove('active');
        playButtonSound('click');
      }
    }

    webcamAperture.addEventListener('click', toggleWebcam);
    hudCamBtn.addEventListener('click', toggleWebcam);

    /* =========================================================================
       5. SYSTEM FUNCTIONS & SCREEN RENDERERS
       ========================================================================= */
    const SYSTEM_FUNCTIONS = [
      { code: "HIB", name: "Hibernation Cryo Units",    subtitle: "STA: 35-05", hex: "#074D43", text_color: "#F1F1F1" },
      { code: "LIF", name: "Life Support Regulation",   subtitle: "ENV: 01-WX", hex: "#263CC5", text_color: "#F1F1F1" },
      { code: "COM", name: "Communications Telemetry",  subtitle: "ATA: 61-08", hex: "#8047CC", text_color: "#F1F1F1" },
      { code: "NAV", name: "Navigation Orbital Course", subtitle: "RTE: 09-EF", hex: "#0054A2", text_color: "#F1F1F1" },
      { code: "MEM", name: "Memory Core Access",        subtitle: "MEM: 04-ZX", hex: "#0D2B0D", text_color: "#00FF88" },
      { code: "ATM", name: "Atmospheric Systems",       subtitle: "ATM: 07-RR", hex: "#2B1400", text_color: "#FF8800" },
      { code: "FLX", name: "Flex Subsystem Relay",      subtitle: "FLX: 11-KY", hex: "#1A003A", text_color: "#CC88FF" },
      { code: "NUC", name: "Nuclear Core Animation",    subtitle: "NUC: 99-PL", hex: "#2B0000", text_color: "#FF4444" }
    ];

    const highScreen = document.getElementById('high-screen');
    const highCanvas = document.getElementById('high-screen-canvas');
    const highCtx = highCanvas.getContext('2d');
    const lowCanvas = document.getElementById('low-screen-canvas');
    const lowCtx = lowCanvas.getContext('2d');

    let programIndex = 0;
    let animFrame = 0;

    function setFunctionCode(code) {
      const idx = SYSTEM_FUNCTIONS.findIndex(f => f.code === code);
      if (idx >= 0) {
        programIndex = idx;
        const fn = SYSTEM_FUNCTIONS[programIndex];
        highScreen.style.backgroundColor = fn.hex;
        if (typeof updateActiveButton === 'function') updateActiveButton();
      }
    }

    function advanceProgram() {
      programIndex = (programIndex + 1) % SYSTEM_FUNCTIONS.length;
      const fn = SYSTEM_FUNCTIONS[programIndex];
      highScreen.style.backgroundColor = fn.hex;
      if (typeof updateActiveButton === 'function') updateActiveButton();
      HALNodeBus.broadcast({ type: 'EVENT_FUNCTION_CHANGE', code: fn.code });
    }

    highScreen.addEventListener('click', () => {
      playButtonSound('click');
      advanceProgram();
    });

    /* Render Loop */
    function renderScreens() {
      animFrame++;
      const hw = highCanvas.width;
      const hh = highCanvas.height;
      const lw = lowCanvas.width;
      const lh = lowCanvas.height;

      renderHighScreen(hw, hh);
      if (!webcamActive) {
        renderLowScreen(lw, lh);
      }

      requestAnimationFrame(renderScreens);
    }

    /* High Screen Panel Renderer */
    function renderHighScreen(w, h) {
      const fn = SYSTEM_FUNCTIONS[programIndex];
      highCtx.fillStyle = fn.hex;
      highCtx.fillRect(0, 0, w, h);
      const tc = fn.text_color || "#F1F1F1";

      if (fn.code === "HIB") {
        highCtx.fillStyle = tc;
        highCtx.font = "bold 11px 'Share Tech Mono', monospace";
        highCtx.textAlign = 'left';
        highCtx.fillText("STA:  35-05", 24, 38);
        highCtx.font = "900 44px 'Orbitron', 'Michroma', sans-serif";
        highCtx.textAlign = 'center';
        highCtx.fillText("H  I  B", w / 2, h / 2 + 15);
        return;
      }

      if (fn.code === "MEM") {
        // Green matrix rain
        highCtx.fillStyle = "#00FF88";
        highCtx.font = "11px 'Share Tech Mono', monospace";
        highCtx.textAlign = 'left';
        highCtx.fillText("MEM: 04-ZX", 20, 26);
        const chars = "01ABCDEF∑∆ΩΨΓΛ";
        const cols = 9, rows = 12;
        for (let c = 0; c < cols; c++) {
          for (let r = 0; r < rows; r++) {
            const phase = (animFrame * 0.07 + c * 1.3 + r * 0.4) % (Math.PI * 2);
            const alpha = 0.15 + 0.85 * Math.max(0, Math.sin(phase));
            highCtx.fillStyle = `rgba(0,255,136,${alpha.toFixed(2)})`;
            const ch = chars[Math.floor((animFrame * 0.11 + c * 7 + r * 3) % chars.length)];
            highCtx.fillText(ch, 18 + c * 22, 48 + r * 15);
          }
        }
        highCtx.fillStyle = "#00FF88";
        highCtx.font = "bold 10px 'Share Tech Mono'";
        highCtx.fillText("MEMORY CORE ACCESS", 18, h - 20);
        return;
      }

      if (fn.code === "ATM") {
        // Atmospheric pressure wave
        highCtx.fillStyle = tc;
        highCtx.font = "bold 11px 'Share Tech Mono', monospace";
        highCtx.textAlign = 'left';
        highCtx.fillText("ATM: 07-RR", 20, 26);
        const cx = w / 2, cy = h / 2 + 10;
        for (let i = 0; i < 5; i++) {
          const phase = (animFrame * 0.04 + i * 0.7) % (Math.PI * 2);
          const r = 30 + i * 20 + Math.sin(phase) * 8;
          const alpha = 0.8 - i * 0.14;
          highCtx.strokeStyle = `rgba(255,136,0,${alpha.toFixed(2)})`;
          highCtx.lineWidth = 1.5;
          highCtx.beginPath();
          highCtx.arc(cx, cy, r, 0, Math.PI * 2);
          highCtx.stroke();
        }
        const pct = Math.round(72 + Math.sin(animFrame * 0.03) * 5);
        highCtx.fillStyle = tc;
        highCtx.font = "bold 13px 'Share Tech Mono'";
        highCtx.textAlign = 'center';
        highCtx.fillText(`O₂  ${pct}%`, cx, cy + 6);
        highCtx.font = "bold 10px 'Share Tech Mono'";
        highCtx.textAlign = 'left';
        highCtx.fillText("ATMOSPHERIC SYSTEMS", 14, h - 20);
        return;
      }

      if (fn.code === "FLX") {
        // Purple waveform relay
        highCtx.fillStyle = tc;
        highCtx.font = "bold 11px 'Share Tech Mono', monospace";
        highCtx.textAlign = 'left';
        highCtx.fillText("FLX: 11-KY", 20, 26);
        highCtx.strokeStyle = tc;
        highCtx.lineWidth = 2;
        for (let lane = 0; lane < 4; lane++) {
          const y0 = 55 + lane * 38;
          highCtx.beginPath();
          for (let x = 10; x < w - 10; x += 2) {
            const phase = (x * 0.06 + animFrame * 0.08 + lane * 1.1);
            const y = y0 + Math.sin(phase) * 12 + Math.sin(phase * 2.3) * 5;
            lane === 0 && x === 10 ? highCtx.moveTo(x, y) : highCtx.lineTo(x, y);
          }
          highCtx.globalAlpha = 0.4 + (lane * 0.15);
          highCtx.stroke();
          highCtx.globalAlpha = 1;
        }
        highCtx.fillStyle = tc;
        highCtx.font = "bold 10px 'Share Tech Mono'";
        highCtx.fillText("FLEX SUBSYSTEM RELAY", 14, h - 20);
        return;
      }

      if (fn.code === "NUC") {
        // Red concentric pulse — nuclear core
        highCtx.fillStyle = tc;
        highCtx.font = "bold 11px 'Share Tech Mono', monospace";
        highCtx.textAlign = 'left';
        highCtx.fillText("NUC: 99-PL", 20, 26);
        const cx = w / 2, cy = h / 2 + 10;
        for (let i = 0; i < 6; i++) {
          const phase = (animFrame * 0.05 + i * 0.55) % (Math.PI * 2);
          const r = 15 + i * 18 + Math.sin(phase) * 6;
          const alpha = 0.9 - i * 0.12;
          highCtx.strokeStyle = `rgba(255,${Math.floor(30 + i * 10)},${Math.floor(i * 5)},${alpha.toFixed(2)})`;
          highCtx.lineWidth = 2 - i * 0.2;
          highCtx.beginPath();
          highCtx.arc(cx, cy, r, 0, Math.PI * 2);
          highCtx.stroke();
        }
        highCtx.fillStyle = "#FF4444";
        highCtx.font = "bold 13px 'Share Tech Mono'";
        highCtx.textAlign = 'center';
        highCtx.fillText("CORE", cx, cy + 5);
        highCtx.font = "bold 10px 'Share Tech Mono'";
        highCtx.textAlign = 'left';
        highCtx.fillText("NUCLEAR CORE ANIMATION", 10, h - 20);
        return;
      }

      // Generic: LIF, COM, NAV (bar graph panel)
      highCtx.fillStyle = tc;
      highCtx.font = "bold 10px 'Share Tech Mono'";
      highCtx.textAlign = 'left';
      highCtx.fillText(fn.subtitle, 20, 32);
      highCtx.font = "900 38px 'Orbitron', 'Michroma', sans-serif";
      highCtx.textAlign = 'center';
      highCtx.fillText(fn.code, w / 2, 95);
      const barCols = 5, startX = 28, startY = 135;
      highCtx.textAlign = 'left';
      for (let c = 0; c < barCols; c++) {
        const x = startX + c * 36;
        const val = 6 + Math.floor(Math.sin((animFrame * 0.06) + c) * 3);
        for (let b = 0; b < 8; b++) {
          const y = startY + b * 6.5;
          highCtx.fillStyle = b < (8 - val) ? tc : "rgba(255,255,255,0.18)";
          highCtx.fillRect(x, y, 24, 4);
        }
      }
      highCtx.fillStyle = tc;
      highCtx.font = "10px 'Share Tech Mono'";
      highCtx.fillText(fn.name.toUpperCase(), 20, h - 20);
    }

    /* Low Screen Telemetry Renderer */
    function renderLowScreen(w, h) {
      const fn = SYSTEM_FUNCTIONS[programIndex];
      lowCtx.fillStyle = '#04091a';
      lowCtx.fillRect(0, 0, w, h);

      const cx = w / 2;
      const cy = h / 2;

      if (fn.code === "HIB") {
        lowCtx.fillStyle = '#ffffff';
        lowCtx.font = "10px 'Share Tech Mono'";
        lowCtx.textAlign = 'left';
        lowCtx.fillText("CRYO 01 VITAL SIGNS", 18, 30);
        lowCtx.strokeStyle = '#00ffcc';
        lowCtx.lineWidth = 2;
        lowCtx.beginPath();
        for (let x = 18; x < w - 18; x += 3) {
          let ecg = 0;
          const phase = (x + animFrame * 3) % 100;
          if (phase > 40 && phase < 46) ecg = -24;
          else if (phase >= 46 && phase < 54) ecg = 20;
          lowCtx.lineTo(x, cy + ecg);
        }
        lowCtx.stroke();
        lowCtx.fillStyle = '#00ffcc';
        lowCtx.font = "10px 'Share Tech Mono'";
        lowCtx.fillText("RATE: 58 BPM  STABLE", 18, h - 22);
      } else if (fn.code === "NUC") {
        // Heat map grid
        lowCtx.fillStyle = '#FF4444';
        lowCtx.font = "bold 10px 'Share Tech Mono'";
        lowCtx.textAlign = 'left';
        lowCtx.fillText("THERMAL MAP // REACTOR", 10, 22);
        const cols = 8, rows = 8, cw = (w - 30) / cols, ch2 = (h - 50) / rows;
        for (let c = 0; c < cols; c++) {
          for (let r = 0; r < rows; r++) {
            const heat = 0.3 + 0.7 * Math.abs(Math.sin(animFrame * 0.04 + c * 0.8 + r * 0.6));
            const red = Math.floor(100 + heat * 155);
            lowCtx.fillStyle = `rgba(${red},${Math.floor(heat * 40)},0,${(0.4 + heat * 0.6).toFixed(2)})`;
            lowCtx.fillRect(14 + c * cw, 32 + r * ch2, cw - 2, ch2 - 2);
          }
        }
        const temp = Math.round(3200 + Math.sin(animFrame * 0.02) * 80);
        lowCtx.fillStyle = '#FF4444';
        lowCtx.font = "bold 10px 'Share Tech Mono'";
        lowCtx.fillText(`CORE: ${temp}K`, 14, h - 18);
      } else if (fn.code === "MEM") {
        // Memory bus activity bars
        lowCtx.fillStyle = '#00FF88';
        lowCtx.font = "bold 10px 'Share Tech Mono'";
        lowCtx.textAlign = 'left';
        lowCtx.fillText("MEMORY BUS ACTIVITY", 14, 22);
        for (let i = 0; i < 8; i++) {
          const activity = 0.2 + 0.8 * Math.abs(Math.sin(animFrame * 0.07 + i * 0.9));
          const bw = Math.floor((w - 50) * activity);
          lowCtx.fillStyle = `rgba(0,255,136,0.15)`;
          lowCtx.fillRect(14, 34 + i * 22, w - 28, 14);
          lowCtx.fillStyle = `rgba(0,255,136,${(0.5 + activity * 0.5).toFixed(2)})`;
          lowCtx.fillRect(14, 34 + i * 22, bw, 14);
          lowCtx.fillStyle = '#00FF88';
          lowCtx.font = "9px 'Share Tech Mono'";
          lowCtx.fillText(`CH${i}`, w - 34, 44 + i * 22);
        }
      } else if (fn.code === "ATM") {
        // Atmosphere readout
        lowCtx.fillStyle = '#FF8800';
        lowCtx.font = "bold 10px 'Share Tech Mono'";
        lowCtx.textAlign = 'left';
        lowCtx.fillText("CABIN ATMOSPHERE", 14, 22);
        const readings = [
          ["O₂",  `${(20.8 + Math.sin(animFrame * 0.02) * 0.3).toFixed(1)}%`],
          ["CO₂", `${(0.04 + Math.sin(animFrame * 0.03) * 0.01).toFixed(3)}%`],
          ["N₂",  `78.1%`],
          ["PRES",`${(101.3 + Math.sin(animFrame * 0.015) * 0.5).toFixed(1)} kPa`],
          ["TEMP",`${(21.5 + Math.sin(animFrame * 0.01) * 0.4).toFixed(1)} °C`],
          ["HUM", `${Math.round(45 + Math.sin(animFrame * 0.025) * 3)}%`],
        ];
        readings.forEach(([label, val], i) => {
          lowCtx.fillStyle = '#FF8800';
          lowCtx.font = "9px 'Share Tech Mono'";
          lowCtx.fillText(label, 14, 44 + i * 28);
          lowCtx.fillStyle = '#ffffff';
          lowCtx.font = "bold 11px 'Share Tech Mono'";
          lowCtx.fillText(val, 60, 44 + i * 28);
        });
      } else if (fn.code === "FLX") {
        // Relay status table
        lowCtx.fillStyle = '#CC88FF';
        lowCtx.font = "bold 10px 'Share Tech Mono'";
        lowCtx.textAlign = 'left';
        lowCtx.fillText("RELAY STATUS", 14, 22);
        const relays = ["R-01","R-02","R-03","R-04","R-05","R-06","R-07","R-08"];
        relays.forEach((r, i) => {
          const on = Math.sin(animFrame * 0.04 + i * 1.3) > -0.5;
          lowCtx.fillStyle = on ? '#CC88FF' : 'rgba(204,136,255,0.25)';
          lowCtx.font = "10px 'Share Tech Mono'";
          lowCtx.fillText(`${r}  ${on ? '■ ON ' : '□ OFF'}`, 14, 40 + i * 22);
        });
      } else {
        // Generic radar for COM, NAV, LIF
        lowCtx.strokeStyle = 'rgba(77, 166, 255, 0.4)';
        lowCtx.lineWidth = 1;
        for (let r = 25; r <= 95; r += 24) {
          lowCtx.beginPath();
          lowCtx.arc(cx, cy, r, 0, Math.PI * 2);
          lowCtx.stroke();
        }
        for (let a = 0; a < Math.PI * 2; a += Math.PI / 4) {
          lowCtx.beginPath();
          lowCtx.moveTo(cx, cy);
          lowCtx.lineTo(cx + Math.cos(a) * 95, cy + Math.sin(a) * 95);
          lowCtx.stroke();
        }
        const sweep = (animFrame * 0.025) % (Math.PI * 2);
        lowCtx.strokeStyle = '#ffffff';
        lowCtx.lineWidth = 1.5;
        lowCtx.beginPath();
        lowCtx.moveTo(cx, cy);
        lowCtx.lineTo(cx + Math.cos(sweep) * 95, cy + Math.sin(sweep) * 95);
        lowCtx.stroke();
        lowCtx.fillStyle = '#ffffff';
        lowCtx.font = "bold 10px 'Share Tech Mono'";
        lowCtx.textAlign = 'left';
        lowCtx.fillText(`NODE // ${fn.code}`, 18, 26);
      }
    }

    let anthropicKey = '';

    function stopAllActivity() {
      if (window.speechSynthesis) window.speechSynthesis.cancel();
      isSpeaking = false;
      subtitleEl.classList.remove('visible');
      if (voxActive) {
        voxActive = false;
        buttons.vox && buttons.vox.classList.remove('active');
      }

    async function callClaude(userText) {
      if (!anthropicKey) {
        anthropicKey = prompt('Enter your Anthropic API key to activate HAL Voice AI:') || '';
        if (!anthropicKey) return null;
      }
      try {
        const res = await fetch('https://api.anthropic.com/v1/messages', {
          method: 'POST',
          headers: {
            'x-api-key': anthropicKey,
            'anthropic-version': '2023-06-01',
            'content-type': 'application/json',
            'anthropic-dangerous-direct-browser-access': 'true'
          },
          body: JSON.stringify({
            model: 'claude-haiku-4-5-20251001',
            max_tokens: 180,
            system: `You are HAL 9000, the onboard computer of the Discovery One. Respond in 2-3 calm, precise sentences. You are helpful but subtly unsettling. Stay in character at all times. Address the crew as Dave unless told otherwise.${weatherContext()}`,
            messages: [{ role: 'user', content: userText }]
          })
        });
        if (!res.ok) { console.error('Claude API error', res.status); return null; }
        const data = await res.json();
        return data.content?.[0]?.text || null;
      } catch (e) { console.error('Claude fetch error', e); return null; }
    }

    function startVoiceAI() {
      const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
      if (!SpeechRecognition) {
        speakHAL("I'm sorry, Dave. Voice recognition is not available in this browser.");
        return;
      }
      if (voxActive) { stopAllActivity(); return; }
      voxActive = true;
      buttons.vox && buttons.vox.classList.add('active');
      speakHAL("I'm listening, Dave.");
      subtitleEl.innerText = '[ LISTENING... ]';
      subtitleEl.classList.add('visible');

      const rec = new SpeechRecognition();
      rec.lang = 'en-US';
      rec.interimResults = false;
      rec.maxAlternatives = 1;

      rec.onresult = async (e) => {
        const transcript = e.results[0][0].transcript;
        subtitleEl.innerText = `[ PROCESSING: "${transcript}" ]`;
        const reply = await callClaude(transcript);
        voxActive = false;
        buttons.vox && buttons.vox.classList.remove('active');
        speakHAL(reply || "I'm sorry, Dave. I was unable to process that request.");
      };

      rec.onerror = () => {
        voxActive = false;
        buttons.vox && buttons.vox.classList.remove('active');
        subtitleEl.classList.remove('visible');
        speakHAL("I did not receive a clear signal, Dave.");
      };

      rec.onend = () => { if (voxActive) { voxActive = false; buttons.vox && buttons.vox.classList.remove('active'); } };
      rec.start();
      HALNodeBus.broadcast({ type: 'COMMAND_VOX' });
    }

    /* =========================================================================
       8. SETUP + WEATHER INTEGRATION
       ========================================================================= */
    let weatherData = null;
    let weatherLat = null, weatherLon = null, weatherCity = 'Moncton';
    let _weatherTimer = null;

    async function geocodeCity(city, country) {
      const url = `https://geocoding-api.open-meteo.com/v1/search?name=${encodeURIComponent(city)}&count=5&language=en&format=json`;
      const res = await fetch(url);
      const data = await res.json();
      let results = (data.results || []);
      if (country) results = results.filter(r => r.country_code === country.toUpperCase());
      if (!results.length && data.results?.length) results = [data.results[0]];
      if (!results.length) throw new Error('City not found');
      return { lat: results[0].latitude, lon: results[0].longitude, name: results[0].name };
    }

    async function fetchWeather(lat, lon) {
      const url = `https://api.open-meteo.com/v1/forecast?latitude=${lat}&longitude=${lon}&current=temperature_2m,apparent_temperature,weather_code,wind_speed_10m,precipitation&temperature_unit=celsius&wind_speed_unit=kmh`;
      const res = await fetch(url);
      const data = await res.json();
      const c = data.current;
      const wmo = {0:'Clear sky',1:'Mainly clear',2:'Partly cloudy',3:'Overcast',45:'Foggy',51:'Light drizzle',53:'Moderate drizzle',61:'Slight rain',63:'Moderate rain',65:'Heavy rain',71:'Slight snow',73:'Moderate snow',75:'Heavy snow',80:'Rain showers',95:'Thunderstorm'};
      return { temp: c.temperature_2m, feels_like: c.apparent_temperature, wind_kmh: c.wind_speed_10m, rain_mm: c.precipitation, condition: wmo[c.weather_code] || `WMO-${c.weather_code}` };
    }

    function weatherContext() {
      if (!weatherData || !weatherCity) return '';
      return ` Current conditions at ${weatherCity}: ${weatherData.temp}°C (feels like ${weatherData.feels_like}°C), ${weatherData.condition}, wind ${weatherData.wind_kmh} km/h, precipitation ${weatherData.rain_mm} mm.`;
    }

    function scheduleWeatherRefresh() {
      if (_weatherTimer) clearInterval(_weatherTimer);
      _weatherTimer = setInterval(async () => {
        if (weatherLat && weatherLon) try { weatherData = await fetchWeather(weatherLat, weatherLon); } catch(e) {}
      }, 600000);
    }

    async function initializeSetup() {
      const keyInput   = document.getElementById('setup-api-key');
      const cityInput  = document.getElementById('setup-city');
      const countryIn  = document.getElementById('setup-country');
      const statusEl   = document.getElementById('setup-status');
      const initBtn    = document.getElementById('setup-init-btn');

      const key     = keyInput.value.trim();
      const city    = cityInput.value.trim() || 'Moncton';
      const country = countryIn.value.trim().toUpperCase() || 'CA';

      if (!key) { statusEl.textContent = 'API KEY REQUIRED'; return; }
      anthropicKey = key;
      weatherCity  = city;
      initBtn.disabled = true;
      statusEl.textContent = 'LOCATING WEATHER STATION…';

      try {
        const geo = await geocodeCity(city, country);
        weatherLat  = geo.lat;
        weatherLon  = geo.lon;
        weatherCity = geo.name;
        statusEl.textContent = `STATION LOCKED — ${geo.name.toUpperCase()} (${geo.lat.toFixed(2)}, ${geo.lon.toFixed(2)})`;
        weatherData = await fetchWeather(weatherLat, weatherLon);
        scheduleWeatherRefresh();
        statusEl.textContent = 'SYSTEMS ONLINE — INITIALIZATION COMPLETE';
        setTimeout(closeSetup, 1200);
      } catch(e) {
        statusEl.textContent = `GEO FAULT: ${(e.message || 'UNKNOWN').toUpperCase()}`;
        initBtn.disabled = false;
        setTimeout(closeSetup, 2000);
      }
    }

    function closeSetup() {
      const overlay = document.getElementById('hal-setup-overlay');
      if (overlay) { overlay.style.opacity = '0'; setTimeout(() => { overlay.style.display = 'none'; }, 400); }
    }

    document.getElementById('setup-init-btn').addEventListener('click', initializeSetup);
    document.getElementById('setup-skip').addEventListener('click', closeSetup);
    document.getElementById('setup-api-key').addEventListener('keydown', e => { if (e.key === 'Enter') initializeSetup(); });

    setInterval(() => {
      advanceProgram();
    }, 25000);

    highScreen.style.backgroundColor = SYSTEM_FUNCTIONS[0].hex;
    renderScreens();
  </script>
</body>
</html>
