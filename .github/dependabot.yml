# Dependabot version updates: monthly, grouped to minor + patch only.
# Majors are deliberately left out of the groups so a breaking change opens its
# own reviewable PR instead of riding along with routine bumps.
# Security updates are not configured here: they reach the repo regardless and
# have their own fixed open-PR limit that open-pull-requests-limit cannot change.
version: 2
updates:
  - package-ecosystem: pip
    directory: "/"
    schedule:
      interval: monthly
    open-pull-requests-limit: 3
    groups:
      pip-minor-and-patch:
        applies-to: version-updates
        patterns:
          - "*"
        update-types:
          - minor
          - patch

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: monthly
    open-pull-requests-limit: 2
    groups:
      actions-minor-and-patch:
        applies-to: version-updates
        patterns:
          - "*"
        update-types:
          - minor
          - patch
