name: Secret scan

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  scan:
    name: Fail the build on committed credentials
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history so the scan sees the whole tree as checked out,
          # not just the tip of a shallow clone.
          fetch-depth: 0

      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      # Run the self-test FIRST. If the scanner has silently stopped
      # detecting anything, this step goes red before the real scan has a
      # chance to pass for the wrong reason. gitleaks passed twice this way
      # in one week: once by crashing, once with no Anthropic rule at all.
      - name: Prove the scanner can still fail
        run: python3 scripts/scan_secrets.py --self-test

      - name: Scan the tree
        run: python3 scripts/scan_secrets.py .
